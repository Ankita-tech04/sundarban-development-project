{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Static Navigation - SB Admin</title>
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>






    </head>
    <body>
        {% include "common/topbar.html" %}
        <div id="layoutSidenav">
            {% include "common/sidebar.html" %}
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">Add Products</h1>
                        <form action="/insproducts/" method="post" enctype="multipart/form-data">

                        {% csrf_token %}
                            <p>Product Title</p>
                            <p><input type="text" name="ptitle" class="form-control"</p>

                            <p>Product Image</p>
                            <p><input type="file" name="kimg" /> </p>
                            <p>Product Details</p>
                            <p><textarea name="pdetails"class="form-control"></textarea></p>
                            <p><input type="submit" name="save" value="Add Products" /></p>

                        </form>





                    </div>
                </main>
                {% include "common/footer.html" %}
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="{% static 'js/scripts.js' %"}></script>
    </body>
</html>
